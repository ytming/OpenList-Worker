name: Auto Sync Upstream (Force)
on:
  schedule:
    - cron: '0 0 * * *'  # 每天自动同步一次，按需改，比如 0 0 * * * 每天一次
  workflow_dispatch: # 支持在 Actions 页面手动点按钮触发同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync fork with upstream (force overwrite)
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "OpenListTeam/OpenList-Worker"
          source_branch: "main"
          target_branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true  # ✅ 关键：强制覆盖
